# TrustMQTT FlashMQ adapter deployment.
listen {
  protocol mqtt
  inet_protocol ip4
  port 1883
}

# Development/replay default, matching the Mosquitto compose service. Set
# false and add mosquitto_password_file for production.
allow_anonymous true
mosquitto_acl_file /etc/flashmq/acl.conf
storage_dir /var/lib/flashmq
log_level info

plugin /usr/lib/flashmq/trustmqtt_flashmq_plugin.so
plugin_timer_period 1
plugin_opt_broker_id default
plugin_opt_redis_host redis
plugin_opt_redis_port 6379
plugin_opt_emit_batch_ms 100
plugin_opt_verdict_refresh_ms 500
plugin_opt_mode enforce
plugin_opt_payload_hash off
